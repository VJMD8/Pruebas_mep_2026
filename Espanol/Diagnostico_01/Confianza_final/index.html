<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>La biblioteca de los cinco mundos</title><style>
:root{font-family:system-ui,Segoe UI,sans-serif;color:#f4f2ff;background:#11152b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#29305c,#11152b 70%);min-height:100vh}.wrap{max-width:780px;margin:auto;padding:24px 15px 55px}.panel{background:#202747;border:1px solid #52608a;border-radius:22px;padding:24px;box-shadow:0 12px 35px #070b1d80}h1{font-size:clamp(26px,5vw,38px);margin:0 0 8px}h2{font-size:23px;margin:0 0 15px}p{line-height:1.65}small,.muted{color:#c3c9e4}.eyebrow{color:#f3c6ff;font-weight:700;letter-spacing:.08em}.options{display:grid;gap:11px;margin:18px 0}.option{display:block;width:100%;padding:15px;text-align:left;border-radius:13px;background:#303a62;border:2px solid #53648f;color:white;font-size:16px;cursor:pointer}.option.selected{border-color:#ffcb78;background:#4c4163}.option:focus-visible,button:focus-visible{outline:3px solid #fff}button{cursor:pointer;font-size:16px}.primary{background:#f5c877;color:#1d2037;border:0;border-radius:12px;padding:13px 20px;font-weight:800}.secondary{background:transparent;border:1px solid #9ca9d5;border-radius:12px;padding:12px 18px;color:white}.primary:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:20px}.progress{height:8px;background:#384268;border-radius:20px;margin:0 0 20px;overflow:hidden}.progress div{height:100%;background:#f5c877;transition:width .2s}.reading{background:#f6f0e7;color:#252c3f;padding:20px;border-radius:14px;line-height:1.8;margin:14px 0;font-size:17px}.label{display:block;font-weight:700;margin:16px 0 8px}textarea{width:100%;min-height:95px;background:#303a62;color:white;border:1px solid #8392bc;border-radius:12px;padding:12px;font:inherit} .tip{background:#2e3c5b;padding:14px;border-left:4px solid #f5c877;border-radius:8px;margin:15px 0}.hidden{display:none} .pill{display:inline-block;border:1px solid #8c9bca;border-radius:100px;padding:6px 11px;margin:4px 5px 4px 0;color:#e8eafa;font-size:13px} </style></head><body><main class="wrap"><section class="panel"><div class="eyebrow">🐈‍⬛ MISIÓN DE SHAI · ESPAÑOL</div><h1>📚 La biblioteca de los cinco mundos</h1><p id="subtitle">Una aventura de lectura, misterio y voleibol. No hay notas visibles, ni cronómetro. Tú decides tu ritmo.</p><div class="progress"><div id="bar" style="width:0%"></div></div><div id="screen"></div></section></main><script>
const DATA={"stories": [{"title": "El último punto", "theme": "Voleibol", "text": "El marcador estaba empatado. Inghal recibió el balón y vio un espacio libre para rematar, pero también notó que su compañera Mara estaba mejor ubicada. Durante todo el partido, Mara había fallado dos saques y evitaba mirar a las demás. Inghal recordó que la entrenadora había dicho: «La confianza se construye cuando compartimos las oportunidades». Levantó el balón hacia Mara. Ella respiró, saltó y consiguió el punto. El equipo celebró, aunque Inghal sabía que el verdadero triunfo había comenzado antes del remate."}, {"title": "La señal del otro lado", "theme": "Misterio ochentero", "text": "En un pueblo rodeado de pinos, tres amigos encontraron una radio que emitía una voz cada vez que se apagaban las luces de la vieja estación. Leo pensó que alguien pedía ayuda. Vera sospechó que era una grabación antigua, porque la voz repetía exactamente la misma frase. En vez de entrar al edificio, decidieron anotar la hora de cada señal. Descubrieron que aparecía cada doce minutos, incluso cuando las luces permanecían encendidas. Entonces comprendieron que la oscuridad no causaba la señal: simplemente había sido la primera coincidencia que observaron. La radio volvió a sonar. Esta vez, la voz dijo una frase distinta: «Gracias por escuchar»."}, {"title": "La biblioteca de los secretos", "theme": "Fantasía", "text": "Alma encontró un libro sin letras en una biblioteca que solo abría cuando llovía. La bibliotecaria le dijo que las páginas respondían a las preguntas sinceras. Alma preguntó: «¿Cómo puedo saberlo todo?». No ocurrió nada. Pensó durante un rato y volvió a preguntar: «¿Cómo puedo aprender algo que todavía no entiendo?». Entonces aparecieron tres palabras: «Observa, pregunta, compara». Alma salió con el libro aún casi vacío, pero por primera vez no sintió vergüenza de no tener todas las respuestas."}, {"title": "El gato y las estrellas", "theme": "Observatorio", "text": "Nora y su gato negro, Sombra, visitaron el observatorio del pueblo. Un cuaderno afirmaba que una estrella desaparecía todas las noches a las nueve. Nora miró el cielo tres noches seguidas: la primera estaba nublado; la segunda, la estrella brilló hasta tarde; la tercera, una rama tapó el telescopio justo a las nueve. Nora concluyó que el cuaderno no demostraba la desaparición de la estrella. Para estar segura, cambió el telescopio de lugar y siguió observando. Sombra se acomodó a su lado, como si también quisiera conocer la respuesta."}, {"title": "La capitana que aprendió a escuchar", "theme": "Voleibol", "text": "Durante un entrenamiento, la capitana Elisa ordenaba cada jugada sin preguntar a sus compañeras. Cuando perdieron tres puntos seguidos, acusó al equipo de no prestar atención. Paula respondió con calma: «Te escuchamos, pero tú no nos escuchas». Elisa se quedó en silencio. En el descanso pidió a cada una que describiera lo que veía desde su posición. Descubrió que la defensa rival dejaba libre una esquina que ella, desde la red, no podía observar. Ajustaron la estrategia y comenzaron a jugar mejor. Aunque no ganaron el partido de práctica, Elisa anotó en su cuaderno: «Dirigir también es escuchar»."}], "questions": [{"story": 0, "pregunta": "¿Cuál es la idea fundamental del relato?", "opciones": ["El valor de confiar en el equipo", "Las reglas del voleibol", "La importancia de ganar siempre", "La dificultad de aprender a sacar"], "clave": 0, "habilidad": "idea_fundamental"}, {"story": 0, "pregunta": "¿Por qué Mara evitaba mirar a sus compañeras?", "opciones": ["Porque quería abandonar el equipo", "Porque estaba insegura tras sus errores", "Porque la entrenadora la había expulsado", "Porque no escuchó el marcador"], "clave": 1, "habilidad": "causa"}, {"story": 0, "pregunta": "¿Qué revela la decisión de Inghal?", "opciones": ["Que temía tocar el balón", "Que buscaba compartir la responsabilidad", "Que no sabía rematar", "Que prefería perder"], "clave": 1, "habilidad": "comportamiento"}, {"story": 0, "pregunta": "¿A qué se refiere el «verdadero triunfo»?", "opciones": ["Al último salto", "Al punto anotado por Inghal", "A recuperar la confianza y actuar juntas", "A terminar primero el campeonato"], "clave": 2, "habilidad": "inferencia"}, {"story": 1, "pregunta": "¿Qué creyeron inicialmente sobre la señal?", "opciones": ["Que ocurría por la lluvia", "Que estaba relacionada con el apagón de luces", "Que provenía de un teléfono", "Que solo sonaba al amanecer"], "clave": 1, "habilidad": "idea_complementaria"}, {"story": 1, "pregunta": "¿Qué dato les permitió cuestionar su primera explicación?", "opciones": ["La voz sonaba más fuerte", "La radio era antigua", "La señal aparecía aunque hubiera luz", "Leo encontró otra radio"], "clave": 2, "habilidad": "evidencia"}, {"story": 1, "pregunta": "¿Qué efecto tuvo registrar las horas?", "opciones": ["Les permitió identificar un patrón", "Hizo desaparecer la voz", "Apagó la estación", "Les impidió escuchar"], "clave": 0, "habilidad": "efecto"}, {"story": 1, "pregunta": "¿Qué tema destaca el relato?", "opciones": ["La valentía consiste en entrar sin pensar", "La observación ayuda a corregir suposiciones", "Toda coincidencia demuestra una causa", "Los misterios siempre son peligrosos"], "clave": 1, "habilidad": "tema_literario"}, {"story": 2, "pregunta": "¿Qué cambió entre la primera y la segunda pregunta de Alma?", "opciones": ["Dejó de buscar aprender", "Pasó de querer saberlo todo a querer comprender", "Olvidó la pregunta anterior", "Pidió que le regalaran respuestas"], "clave": 1, "habilidad": "inferencia"}, {"story": 2, "pregunta": "¿Por qué el libro respondió la segunda vez?", "opciones": ["Porque empezó a llover más", "Porque la bibliotecaria escribió", "Porque la pregunta expresaba un deseo genuino de aprender", "Porque Alma abrió otra página"], "clave": 2, "habilidad": "causa"}, {"story": 2, "pregunta": "¿Cuál detalle complementa la idea principal?", "opciones": ["La biblioteca abría cuando llovía", "Alma salió sin el libro", "La bibliotecaria cerró la puerta", "El libro tenía dibujos de animales"], "clave": 0, "habilidad": "idea_complementaria"}, {"story": 2, "pregunta": "¿Qué sentimiento experimenta Alma al final?", "opciones": ["Vergüenza por preguntar", "Tranquilidad ante lo que aún no sabe", "Enojo con la bibliotecaria", "Temor a los libros"], "clave": 1, "habilidad": "pensamiento_personaje"}, {"story": 3, "pregunta": "¿Cuál era la afirmación del cuaderno?", "opciones": ["Que una estrella desaparecía a las nueve", "Que el telescopio estaba roto", "Que el cielo siempre estaba nublado", "Que el gato veía las estrellas"], "clave": 0, "habilidad": "idea_fundamental"}, {"story": 3, "pregunta": "¿Qué causó que no se viera la estrella la tercera noche?", "opciones": ["La estrella dejó de existir", "La luna la cubrió", "Una rama bloqueó la vista", "El telescopio cambió de color"], "clave": 2, "habilidad": "causa"}, {"story": 3, "pregunta": "¿Por qué Nora cambió el telescopio de lugar?", "opciones": ["Para comprobar si el obstáculo afectaba la observación", "Para acercarse al gato", "Para evitar escribir en el cuaderno", "Para mirar el suelo"], "clave": 0, "habilidad": "comportamiento"}, {"story": 3, "pregunta": "¿Qué conclusión está mejor respaldada por el texto?", "opciones": ["Las estrellas se apagan a las nueve", "No verla no demuestra que desapareció", "Todos los cuadernos son falsos", "Sombra descubrió una estrella nueva"], "clave": 1, "habilidad": "inferencia"}, {"story": 4, "pregunta": "¿Cuál es el conflicto principal?", "opciones": ["El equipo no tiene uniforme", "La capitana dirige sin escuchar a las demás", "Paula quiere ser capitana", "La cancha es demasiado pequeña"], "clave": 1, "habilidad": "conflicto"}, {"story": 4, "pregunta": "¿Qué provocó que Elisa reconsiderara su actitud?", "opciones": ["El comentario de Paula", "La llegada de otra entrenadora", "Una lesión", "La suspensión del partido"], "clave": 0, "habilidad": "causa"}, {"story": 4, "pregunta": "¿Qué información obtuvo Elisa al escuchar?", "opciones": ["Que necesitaban más balones", "Que la defensa rival dejaba libre una esquina", "Que el marcador estaba equivocado", "Que nadie quería jugar"], "clave": 1, "habilidad": "idea_complementaria"}, {"story": 4, "pregunta": "¿Qué significa «Dirigir también es escuchar»?", "opciones": ["Una líder debe dejar todas las decisiones a otras personas", "Escuchar perspectivas mejora las decisiones compartidas", "Es mejor permanecer siempre en silencio", "La autoridad depende de hablar más fuerte"], "clave": 1, "habilidad": "tema_literario"}]};const Q=DATA.questions;const started=Date.now();let stage='welcome',story=0,question=0,answers={},feedback={},reflection={};const screen=document.getElementById('screen'),bar=document.getElementById('bar');function node(tag,text,cls){let e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}function add(tag,text,cls){let e=node(tag,text,cls);screen.append(e);return e}function btn(text,fn,cls='primary'){let b=node('button',text,cls);b.type='button';b.addEventListener('click',fn);return b}function actions(back,next){let a=add('div',undefined,'actions');if(back)a.append(btn('← Volver',back,'secondary'));if(next)a.append(next)}function choose(options,current,callback){let list=add('div',undefined,'options');options.forEach((v,i)=>{let b=btn(v,()=>callback(i),'option'+(current===i?' selected':''));list.append(b)})}function render(){screen.replaceChildren();let total=Q.length;bar.style.width=(stage==='practice'?((question+1)/total*100):stage==='done'?'100%':'4%')+'%';if(stage==='welcome'){add('h2','¡Hola, Naiomy! 💜');add('p','Shai te espera con cinco mundos: dos historias de voleibol, un misterio sobrenatural, una biblioteca mágica y un observatorio con un gato negro.');add('p','Primero quiero escucharte sobre Matemáticas. Después te recordaré algunas claves de lectura y comenzaremos nuestra aventura.');add('div','🌸 No tienes que demostrar nada. Lee con calma y confía en tu capacidad de comprender.','tip');actions(null,btn('Comenzar nuestra conversación →',()=>{stage='reflection';render()}));return}if(stage==='reflection'){add('h2','💜 Cuéntame sobre Matemáticas');const fields=[['emocion','¿Cómo te sentiste durante el examen de Matemáticas?',['Muy tranquila 😊','Contenta y segura 🌟','Un poco nerviosa 💭','Muy nerviosa 😟']],['dificultad','¿Cómo te parecieron las preguntas?',['Más fáciles de lo que esperaba','Una mezcla de fáciles y difíciles','Bastante difíciles','No estoy segura todavía']],['ayuda','¿Cuánto te ayudaron nuestras misiones?',['Me ayudaron mucho','Me ayudaron un poco','No sé si me ayudaron','Me gustaría cambiar algo']],['estrategia','¿Qué hiciste durante el examen?',['Leí con calma y revisé','Leí con calma, pero casi no revisé','Respondí bastante rápido','Usé distintas estrategias']]];fields.forEach(([key,label,opts])=>{add('label',label,'label');choose(opts,reflection[key],i=>{reflection[key]=i;render()})});add('label','¿Hay algo que quieras preguntarle o contarle a Shai? (Opcional)','label');let ta=add('textarea');ta.placeholder='Te escucho...';ta.value=reflection.comentario||'';ta.addEventListener('input',()=>reflection.comentario=ta.value);let n=btn('Seguir al repaso →',()=>{stage='guide';render()});n.disabled=fields.some(x=>reflection[x[0]]===undefined);actions(()=>{stage='welcome';render()},n);return}if(stage==='guide'){add('h2','🔎 Tu brújula de lectora experta');add('p','Antes de comenzar, recordemos cinco secretos:');[['Idea fundamental','Es lo más importante que comunica el texto, no un detalle aislado.'],['Causa y efecto','Causa = por qué pasó. Efecto = qué ocurrió como consecuencia.'],['Inferencia','Una conclusión basada en pistas del texto, aunque no esté escrita literalmente.'],['Conflicto y comportamiento','Conflicto = problema principal. Comportamiento = lo que las acciones revelan del personaje.'],['Evidencia','Cuando dos respuestas parezcan posibles, vuelve al texto y busca cuál tiene más apoyo.']].forEach(x=>add('div',x[0]+' — '+x[1],'tip'));add('p','Hay cinco lecturas y puedes detenerte entre ellas. Las tres primeras son el recorrido principal; las otras dos son desafíos opcionales.');actions(()=>{stage='reflection';render()},btn('Entrar al primer mundo →',()=>{stage='practice';question=0;render()}));return}if(stage==='practice'){let q=Q[question],s=DATA.stories[q.story];add('div','LECTURA '+(q.story+1)+' DE 5 · '+s.theme.toUpperCase(),'eyebrow');add('h2',s.title);add('div',s.text,'reading');add('div','Pregunta '+(question+1)+' de '+Q.length,'muted');add('h2',q.pregunta);choose(q.opciones,answers[question],i=>{answers[question]=i;render()});add('div','Antes de continuar: ¿tu elección responde exactamente lo que pregunta el enunciado? Puedes volver a leer.','tip');let next=btn(question===Q.length-1?'Finalizar aventura →':'Continuar →',()=>{if(question===Q.length-1){stage='closing';render();return}let old=Q[question].story;question++;if(Q[question].story!==old){stage='break';render()}else render()});next.disabled=answers[question]===undefined;actions(question===0?()=>{stage='guide';render()}:()=>{question--;render()},next);return}if(stage==='break'){let completed=DATA.stories[Q[question-1].story].title;add('h2','✨ ¡Un mundo completado!');add('p','Terminaste «'+completed+'». Puedes tomar agua, estirarte o descansar un momento.');add('p','Recuerda: tu trabajo no es responder a toda velocidad. Es leer, comprender y elegir con evidencia.');if(question>=12){add('div','Ya completaste las tres lecturas principales. Las dos siguientes son opcionales. Si estás cansada, puedes cerrar aquí con orgullo.','tip');actions(()=>{question--;stage='practice';render()},btn('Terminar aquí y cerrar la misión',()=>{stage='closing';render()}));let a=add('div',undefined,'actions');a.append(btn('Continuar con los retos opcionales →',()=>{stage='practice';render()}));}else actions(()=>{question--;stage='practice';render()},btn('Estoy lista para la siguiente lectura →',()=>{stage='practice';render()}));return}if(stage==='closing'){add('h2','🌸 Una última conversación');add('p','Has recorrido mundos distintos usando tu atención, tu imaginación y tu capacidad para encontrar pistas.');add('label','¿Cómo te sientes para el examen de Español de mañana?','label');choose(['Tranquila y preparada 😊','Con ganas de intentarlo 🌟','Un poco nerviosa 💜','Quisiera repasar algo más'],reflection.final,i=>{reflection.final=i;render()});add('label','¿Qué has descubierto de ti durante estos días de pruebas? (Opcional)','label');let ta=add('textarea');ta.placeholder='Puedes escribir lo que quieras...';ta.value=reflection.aprendizaje||'';ta.addEventListener('input',()=>reflection.aprendizaje=ta.value);let n=btn('Completar mi misión →',()=>{stage='done';render()});n.disabled=reflection.final===undefined;actions(()=>{stage='practice';question=Math.min(question,Q.length-1);render()},n);return}if(stage==='done'){add('h2','🌟 ¡Misión cumplida, Naiomy!');add('p','Shai quiere recordarte algo: sabes leer con atención, buscar pistas y comprender historias. Mañana no tienes que correr ni adivinar. Puedes volver al texto tantas veces como lo necesites.');add('div','💜 Descansa. Tus talentos no dependen de una sola prueba.','tip');let result={mision:'La biblioteca de los cinco mundos',fecha:new Date().toLocaleString('es-CR'),duracion_min:Math.max(1,Math.round((Date.now()-started)/60000)),tipo:'practica_final_sin_nota',reflexion_matematicas:{emocion:['Muy tranquila','Contenta y segura','Un poco nerviosa','Muy nerviosa'][reflection.emocion],dificultad:['Más fáciles de lo que esperaba','Mezcla','Bastante difíciles','No estoy segura'][reflection.dificultad],ayuda:['Mucho','Un poco','No sé','Cambiar algo'][reflection.ayuda],estrategia:['Leí y revisé','Leí pero casi no revisé','Rápido','Distintas estrategias'][reflection.estrategia],comentario:reflection.comentario||'',final:reflection.final,aprendizaje:reflection.aprendizaje||''},total_respondidas:Object.keys(answers).length,detalle:Q.map((q,i)=>({numero:i+1,lectura:DATA.stories[q.story].title,habilidad:q.habilidad,pregunta:q.pregunta,respuesta:answers[i]===undefined?null:q.opciones[answers[i]],clave:q.opciones[q.clave],acierto:answers[i]===undefined?null:answers[i]===q.clave}))};let download=btn('📥 Guardar mi resultado para compartir con papá',()=>{let blob=new Blob([JSON.stringify(result,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='resultado_mision_final_espanol.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)});actions(null,download);add('p','Si ya guardaste tu resultado, puedes cerrar esta página.','muted');return}}render();
</script></body></html>
