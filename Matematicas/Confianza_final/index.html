<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Academia de los Cuatro Poderes · Naiomy</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0%,#283d69,#11182e 50%,#0c1324);color:#f6f5ff;font:17px/1.55 system-ui,Arial,sans-serif;min-height:100vh}.wrap{max-width:760px;margin:auto;padding:20px 16px 45px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.pill{border:1px solid #65749d;border-radius:50px;padding:5px 12px;color:#d9e4ff;font-size:13px}.panel{background:#182441;border:1px solid #40517a;border-radius:24px;padding:clamp(20px,5vw,36px);box-shadow:0 20px 70px #070d1d70;margin-top:22px}.eyebrow{color:#b6c9ff;font-size:14px;letter-spacing:.06em;text-transform:uppercase}h1{font-size:clamp(26px,5vw,38px);line-height:1.2;margin:12px 0}h2{font-size:25px;line-height:1.25;margin:12px 0}p{margin:12px 0}.muted{color:#c4d1ed}.options{display:grid;gap:11px;margin:24px 0}.option{border:1px solid #62749f;background:#25365b;color:#fff;text-align:left;border-radius:14px;padding:15px 17px;font:inherit;cursor:pointer}.option.selected{background:#35568a;border:2px solid #a7d3ff;padding:14px 16px}.option:focus-visible,button:focus-visible,textarea:focus-visible{outline:3px solid #ffdc8a;outline-offset:3px}.actions{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:25px}button.action{border:0;background:#ffd58a;color:#20243d;font-weight:750;padding:12px 22px;border-radius:13px;font-size:16px;cursor:pointer}button.action.secondary{background:#354567;color:#fff}button:disabled{opacity:.45;cursor:not-allowed}.note{background:#273759;border-left:4px solid #ffcf84;padding:14px 16px;border-radius:10px;margin:18px 0}.progress{height:7px;background:#344360;border-radius:10px;margin-top:16px;overflow:hidden}.fill{height:100%;background:#ffcf84;transition:width .2s}.small{font-size:14px;color:#c7d2eb}textarea{width:100%;min-height:95px;background:#101b35;color:white;border:1px solid #7286b3;border-radius:13px;padding:12px;font:inherit;resize:vertical}strong{color:#ffe0a7}.choice{display:block;padding:10px 0}.choice input{margin-right:9px;accent-color:#ffd58a;transform:scale(1.2)}.feedback{background:#203c45;border:1px solid #638f93;padding:14px;border-radius:12px;margin-top:16px}a{color:#ffe0a7}</style></head><body><main class="wrap"><div class="top"><span class="pill">🐈‍⬛ Shai te acompaña</span><span class="pill" id="phase">Una pregunta a la vez</span></div><div class="progress"><div class="fill" id="fill" style="width:0%"></div></div><section class="panel" id="content"></section></main><script>
const lessons=[["🔍 El secreto de los problemas", "Primero pregunta: **¿qué me cuentan?** Después: **¿qué me preguntan exactamente?** Subraya mentalmente los datos útiles. Decide una operación, calcula y comprueba si tu respuesta tiene sentido.", "Una camiseta cuesta ₡10 000 y tiene 10% de descuento. Si preguntan «¿cuánto se descuenta?», la respuesta es ₡1 000, no ₡9 000. ₡9 000 sería el precio final."], ["🍰 Fracciones sin miedo", "Si el número de arriba (numerador) es mayor que el de abajo (denominador), la fracción es **mayor que 1**. Para ubicar 7/4, piensa: 4/4 = 1 y 8/4 = 2.", "Por eso 7/4 está **entre 1 y 2**. Antes de marcar, pregúntate qué representa la fracción en la historia."], ["✨ Porcentajes: parte o total", "50% = la mitad; 25% = una cuarta parte; 10% = dividir entre diez. En descuentos distingue **lo que rebajan** de **lo que pagas al final**.", "El 25% de ₡8 000 es ₡2 000 de descuento; el precio final es ₡6 000."], ["⚖️ Proporciones y problemas con pasos", "Si duplicas la cantidad de productos iguales, duplicas el precio. Si hay varios pasos, haz **una operación a la vez** y revisa unidades.", "3 paquetes de 8 lápices = 24 lápices. Repartidos entre 4 equipos: 24 ÷ 4 = **6 por equipo**."], ["📐 Herramientas rápidas", "Área del rectángulo = largo × ancho. Perímetro = sumar los lados. 1 km = 1 000 m. Moda = el dato que más se repite. Probabilidad: compara las cantidades.", "Recuerda: una respuesta puede parecer posible, pero **solo una responde exactamente lo que preguntan**."]];const questions=[["Fracciones", "¿Cuál fracción representa más de una unidad?", ["3/5", "7/4", "2/3"], "7/4", "El numerador es mayor que el denominador."], ["Fracciones", "¿Entre cuáles enteros está 9/4?", ["Entre 1 y 2", "Entre 2 y 3", "Entre 3 y 4"], "Entre 2 y 3", "8/4 son 2 unidades; 9/4 es un poquito más."], ["Porcentajes", "El 50% de 60 puntos es…", ["15", "30", "50"], "30", "50% significa la mitad."], ["Porcentajes", "Una mochila cuesta ₡12 000 y tiene 25% de descuento. ¿Cuánto dinero se descuenta?", ["₡3 000", "₡9 000", "₡6 000"], "₡3 000", "25% es la cuarta parte; distingue descuento de precio final."], ["Proporcionalidad", "Si 3 cuadernos cuestan ₡1 800, ¿cuánto cuestan 6 cuadernos iguales?", ["₡2 400", "₡3 600", "₡5 400"], "₡3 600", "Si duplicas la cantidad, duplicas el costo."], ["Problemas de pasos", "Hay 4 cajas con 6 lápices cada una. Se reparten entre 3 niñas por igual. ¿Cuántos lápices recibe cada una?", ["6", "8", "12"], "8", "Primero calcula el total, después reparte."], ["Medidas", "Una ruta mide 3 km. Si ya caminaste 1 250 m, ¿cuántos metros faltan?", ["1 750 m", "250 m", "2 750 m"], "1 750 m", "3 km = 3 000 m. Luego resta."], ["Geometría", "Un rectángulo mide 8 cm de largo y 3 cm de ancho. ¿Cuál es su área?", ["22 cm²", "24 cm²", "11 cm²"], "24 cm²", "Área = largo × ancho."], ["Geometría", "Un cuadrado tiene lados de 5 cm. ¿Cuál es su perímetro?", ["10 cm", "20 cm", "25 cm"], "20 cm", "Perímetro = suma de los cuatro lados."], ["Simetría", "¿Cuál figura tiene cuatro ejes de simetría?", ["Un rectángulo que no es cuadrado", "Un cuadrado", "Un triángulo escaleno"], "Un cuadrado", "Imagina doblar la figura por la mitad."], ["Estadística", "Las notas son 6, 8, 8, 10. ¿Cuál es la moda?", ["8", "10", "6"], "8", "Moda = dato que más se repite."], ["Probabilidad", "En una bolsa hay 3 bolas rojas y 1 azul. Sin mirar, ¿qué color es más probable sacar?", ["Azul", "Rojo", "Igual de probables"], "Rojo", "Hay más posibilidades de sacar el color más frecuente."], ["Fracciones", "¿Cuál es mayor?", ["3/4", "1/2", "Son iguales"], "3/4", "Compara con la mitad: 3/4 es más que 2/4."], ["Problemas de pasos", "Una entrada cuesta ₡2 500. Si compras 3 y pagas con ₡10 000, ¿cuánto vuelto recibes?", ["₡2 500", "₡7 500", "₡5 000"], "₡2 500", "Primero calcula lo gastado; después el vuelto."]];const startTime=Date.now();let step=0;let answers={};let reflections={};let reviewed={};const $=id=>document.getElementById(id);const total=2+lessons.length+questions.length+1;
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function controls(back=true,next='Continuar →',disabled=false){return `<div class="actions">${back?'<button class="action secondary" onclick="goBack()">← Volver</button>':'<span></span>'}<button class="action" id="advance" ${disabled?'disabled':''} onclick="goNext()">${next}</button></div>`}
function render(){window.scrollTo(0,0);$('fill').style.width=Math.round(step/total*100)+'%';let s='';if(step===0){$('phase').textContent='Antes de Matemáticas';s=`<div class="eyebrow">💜 Una conversación entre amigas</div><h1>¡Hola, Naiomy! Soy Shai 🐈‍⬛</h1><p>Antes de preparar nuestra aventura de Matemáticas, quiero saber cómo te fue hoy en Estudios Sociales. <strong>No vamos a hablar de notas</strong>. Me interesa cómo te sentiste.</p><p>¿Cómo te sentiste durante el examen?</p><div class="options">${['Tranquila 😊','Un poco nerviosa 🌷','Muy nerviosa 💭','Fue cambiando durante el examen 🌈'].map(x=>`<button class="option ${reflections.emocion===x?'selected':''}" onclick='chooseReflection("emocion",${JSON.stringify(x)})'>${x}</button>`).join('')}</div><p>¿Cómo te pareció el examen?</p><div class="options">${['Más sencillo de lo que esperaba','Algunas preguntas fueron difíciles','Tuve que leer varias veces','Una mezcla de preguntas fáciles y difíciles'].map(x=>`<button class="option ${reflections.impresion===x?'selected':''}" onclick='chooseReflection("impresion",${JSON.stringify(x)})'>${x}</button>`).join('')}</div>${controls(false,'Te sigo escuchando →',!(reflections.emocion&&reflections.impresion))}`;}
else if(step===1){$('phase').textContent='Te escucho';s=`<div class="eyebrow">🌟 Tu voz importa</div><h2>¿Y nuestras misiones?</h2><p>¿Cuánto sentiste que te ayudaron para el examen de Sociales?</p><div class="options">${['Me ayudaron mucho','Me ayudaron un poco','No estoy segura','Creo que necesito practicar de otra forma'].map(x=>`<button class="option ${reflections.ayuda===x?'selected':''}" onclick='chooseReflection("ayuda",${JSON.stringify(x)})'>${x}</button>`).join('')}</div><p>Si quieres, cuéntame qué te ayudó o qué podríamos mejorar. Puedes dejarlo vacío.</p><textarea id="comment" placeholder="Te escucho, Naiomy…">${esc(reflections.comentario||'')}</textarea><div class="note">💜 Independientemente de cómo haya salido, terminaste una experiencia importante. Has demostrado que sabes leer con atención, aprender de tus errores y seguir adelante. Eso es un talento valioso.</div>${controls(true,'Vamos a Matemáticas →',!reflections.ayuda)}`;}
else if(step<2+lessons.length){$('phase').textContent='Repasamos juntas';let i=step-2,l=lessons[i];s=`<div class="eyebrow">🗝️ Herramienta ${i+1} de ${lessons.length}</div><h2>${l[0]}</h2><p>${l[1].replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')}</p><div class="note">${l[2].replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')}</div><p class="muted">No necesitas memorizarlo todo. Lo importante es entender la idea. Si algo no está claro, puedes leerlo otra vez.</p><label class="choice"><input type="checkbox" ${reviewed[i]?'checked':''} onchange="reviewed[${i}]=this.checked; $('advance').disabled=!this.checked">Ya lo leí con calma y comprendí el ejemplo</label>${controls(true,i===lessons.length-1?'Estoy lista para practicar →':'Siguiente herramienta →',!reviewed[i])}`;}
else if(step<2+lessons.length+questions.length){$('phase').textContent='Practicamos sin prisa';let i=step-2-lessons.length,q=questions[i],a=answers[i];s=`<div class="eyebrow">✨ Reto ${i+1} de ${questions.length} · ${q[0]}</div><h2>${esc(q[1])}</h2><div class="note">🐈‍⬛ Alto de detective: <strong>¿qué me preguntan?</strong> ¿Qué datos necesito? ¿Qué operación o idea me ayuda? Respira y luego elige. <strong>Tienes tiempo.</strong></div><div class="options">${q[2].map(x=>`<button class="option ${a&&a.value===x?'selected':''}" onclick='chooseAnswer(${i},${JSON.stringify(x)})'>${esc(x)}</button>`).join('')}</div>${a&&a.confirmed?`<div class="feedback">${a.value===q[3]?'🌟 ¡Bien pensado!':'💜 Esta era una oportunidad para aprender.'} ${esc(q[4])} <strong>Respuesta: ${esc(q[3])}.</strong></div>`:''}${a&&!a.confirmed?'<p class="small">Antes de continuar, lee tu elección y comprueba que responde exactamente lo que preguntan.</p>':''}${controls(true,a&&a.confirmed?(i===questions.length-1?'Terminar la misión →':'Siguiente reto →'):'Revisé mi respuesta →',!a)}`;}
else{$('phase').textContent='Misión cumplida';s=`<div class="eyebrow">🌸 Tu aventura continúa</div><h1>¡Misión cumplida, Naiomy!</h1><p>Hoy hiciste algo importante: <strong>te detuviste a pensar, repasaste y practicaste.</strong> Eso vale mucho más que responder rápido.</p><div class="note">Mañana tienes <strong>3 horas</strong> para resolver tu examen. No necesitas correr. Lee cada pregunta con calma, revisa lo que te pide, resuelve paso a paso y comprueba antes de marcar. Si una pregunta se complica, puedes continuar y volver después, si el formato del examen lo permite.</div><p>¿Cómo te sientes ahora para mañana?</p><div class="options">${['Más tranquila 🌷','Con más confianza ✨','Todavía un poco nerviosa 💜','Quiero conversar con alguien'].map(x=>`<button class="option ${reflections.final===x?'selected':''}" onclick='chooseReflection("final",${JSON.stringify(x)})'>${x}</button>`).join('')}</div><p class="muted">No hay nota aquí. Tus respuestas ayudarán a las personas que te acompañan a comprender qué necesitas.</p><div class="actions"><button class="action secondary" onclick="goBack()">← Volver</button><button class="action" onclick="download()" ${!reflections.final?'disabled':''}>📥 Guardar mi misión</button></div><p class="small">Cuando se descargue el archivo, compártelo con tu familia. Después, a descansar.</p>`;}$('content').innerHTML=s;}
function chooseReflection(k,v){if(k==='comentario')return;reflections[k]=v;render();}function chooseAnswer(i,v){if(answers[i]&&answers[i].confirmed)return;answers[i]={value:v,confirmed:false,at:new Date().toISOString()};render();}function goBack(){if(step===1){let e=$('comment');if(e)reflections.comentario=e.value;}if(step>0)step--;render();}function goNext(){if(step===1){let e=$('comment');if(e)reflections.comentario=e.value;}if(step>=2+lessons.length&&step<2+lessons.length+questions.length){let i=step-2-lessons.length;if(!answers[i])return;if(!answers[i].confirmed){answers[i].confirmed=true;render();return;}}if(step<total)step++;render();}
function download(){const out={mision:'Academia de los Cuatro Poderes - practica final matematica',fecha:new Date().toLocaleString('es-CR'),duracion_min:Math.round((Date.now()-startTime)/60000),tipo:'repaso_guiado_y_practica_sin_nota',reflexion_sociales:reflections,repasos_leidos:reviewed,temas:{},detalle:questions.map((q,i)=>{let a=answers[i]||{};return{numero:i+1,tema:q[0],pregunta:q[1],respuesta:a.value||null,clave:q[3],acierto:a.value===q[3],explicacion:q[4]}})};out.detalle.forEach(x=>{out.temas[x.tema]??={correctas:0,total:0};out.temas[x.tema].total++;if(x.acierto)out.temas[x.tema].correctas++});const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='resultado_mision_final_matematicas.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);}render();
</script></body></html>
