<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>La última misión de Shai · Ciencias</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#eaf1ff;background:#10152b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 30% 0,#29346c,#10152b 60%);min-height:100vh}main{max-width:810px;margin:auto;padding:22px 15px 55px}.panel{background:#1c2548;border:1px solid #52639b;border-radius:22px;padding:26px;box-shadow:0 15px 38px #0004}h1{font-size:clamp(1.8rem,5vw,2.7rem);line-height:1.15;margin:8px 0}h2{font-size:1.45rem}p{line-height:1.7}small,.muted{color:#c0cbe8}.pill{display:inline-block;background:#36457d;padding:7px 12px;border-radius:30px;font-size:.85rem}button,.choice{font:inherit;cursor:pointer;border:1px solid #8198e6;background:#2d3d79;color:white;border-radius:14px;padding:13px 17px}button:hover,.choice:hover{background:#3e54a2}button:focus-visible,.choice:focus-visible,textarea:focus-visible{outline:3px solid #ffca70;outline-offset:2px}button:disabled{opacity:.4;cursor:not-allowed}.primary{background:#ebae4b;color:#182043;border:0;font-weight:800}.primary:hover{background:#ffd083}.nav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:22px}.choices{display:grid;gap:11px;margin-top:20px}.choice{text-align:left;width:100%;line-height:1.4}.choice.selected{background:#5872d2;border-color:#fff;box-shadow:inset 0 0 0 1px white}.story{background:#121a36;border-left:4px solid #f6bf6a;padding:14px 18px;border-radius:10px}.progress{height:9px;background:#39436b;border-radius:30px;overflow:hidden;margin:14px 0 22px}.progress>div{height:100%;background:#f1b95d;transition:width .2s}textarea{display:block;width:100%;min-height:92px;background:#121a36;color:white;border:1px solid #8294d2;border-radius:12px;padding:13px;font:inherit;resize:vertical}label{display:block;margin-top:18px;font-weight:650}.options{display:flex;flex-wrap:wrap;gap:9px;margin:10px 0 20px}.options button.active{background:#5974c8;outline:2px solid white}.hidden{display:none}.highlight{color:#ffd98d}footer{text-align:cente </style></head><body><main><div class="pill">💜 Academia de los Cuatro Mundos · 16 de octubre</div><section class="panel" id="app" aria-live="polite"></section><footer>Una pregunta a la vez. Tu curiosidad es tu superpoder. 🐈‍⬛</footer></main><script>
const DATA=[{"emoji": "🏐", "title": "El torneo de la energía", "story": "Durante un torneo de voleibol, Naio y sus amigas descubren que la ciencia está presente en cada movimiento, respiración y decisión.", "questions": [{"q": "Después de varios minutos de juego, una atleta respira más rápido. ¿Cuál es la explicación más adecuada?", "opts": ["Su cuerpo necesita más oxígeno para obtener energía", "Sus pulmones dejan de funcionar durante el ejercicio", "El aire se transforma directamente en músculos"], "key": 0, "explanation": "Al hacer ejercicio, aumenta la demanda de oxígeno y energía."}, {"q": "¿Qué sistema transporta oxígeno y nutrientes a los músculos?", "opts": ["El sistema digestivo por sí solo", "El sistema circulatorio", "El sistema óseo"], "key": 1, "explanation": "La sangre del sistema circulatorio transporta oxígeno y nutrientes."}, {"q": "Una jugadora bebe agua después del partido. ¿Por qué es importante?", "opts": ["Porque el agua sustituye por completo a los alimentos", "Porque ayuda a reponer líquidos perdidos por el sudor", "Porque elimina la necesidad de descansar"], "key": 1, "explanation": "La hidratación repone parte del agua perdida por el sudor."}, {"q": "Al golpear la pelota, ¿qué cambio de energía ocurre principalmente?", "opts": ["La energía del movimiento de la mano se transfiere a la pelota", "La pelota crea energía de la nada", "La energía desaparece al tocar la pelota"], "key": 0, "explanation": "La energía se transfiere de la mano a la pelota, que se pone en movimiento."}, {"q": "Si una jugadora duerme muy poco antes del torneo, ¿qué práctica sería más saludable?", "opts": ["Dormir adecuadamente y mantener una alimentación variada", "Evitar tomar agua", "Entrenar toda la noche sin descanso"], "key": 0, "explanation": "El descanso, la hidratación y la alimentación apoyan el bienestar."}]}, {"emoji": "🔦", "title": "La señal del laboratorio", "story": "Un grupo de amigos encuentra un laboratorio abandonado en el bosque. Una luz se enciende, el aire se enfría y aparecen pistas que solo la observación científica puede explicar.", "questions": [{"q": "Una linterna funciona con pilas. ¿Qué transformación energética sucede?", "opts": ["La energía química de las pilas se transforma en energía eléctrica y luego luminosa", "La luz se transforma en alimento", "La energía eléctrica desaparece antes de llegar al foco"], "key": 0, "explanation": "Las pilas almacenan energía química que permite producir luz."}, {"q": "Un vaso con agua fría se cubre de gotitas por fuera. ¿De dónde provienen principalmente?", "opts": ["Del vapor de agua del aire que se condensa", "Del vidrio que se convierte en agua", "Del agua que atraviesa siempre el vidrio intacto"], "key": 0, "explanation": "El vapor de agua del aire se condensa sobre una superficie fría."}, {"q": "Los amigos comparan dos plantas: una recibe luz y la otra permanece en oscuridad. ¿Qué variable cambiaron deliberadamente?", "opts": ["La cantidad de luz", "La especie de planta, necesariamente", "La gravedad del planeta"], "key": 0, "explanation": "La variable manipulada es la exposición a la luz."}, {"q": "Un metal se calienta al dejarlo cerca de una fuente de calor. ¿Qué afirmación es correcta?", "opts": ["El calor puede transferirse desde un cuerpo más caliente a otro más frío", "El frío se fabrica dentro del metal", "La materia desaparece cuando aumenta la temperatura"], "key": 0, "explanation": "La energía térmica puede transferirse entre cuerpos a distintas temperaturas."}, {"q": "Si una hipótesis no coincide con los resultados observados, ¿qué deberían hacer?", "opts": ["Ocultar los resultados", "Revisar la hipótesis y repetir o mejorar la investigación", "Cambiar los datos para que coincidan"], "key": 1, "explanation": "La investigación científica revisa explicaciones a la luz de la evidencia."}]}, {"emoji": "🐈‍⬛", "title": "El jardín del gato negro", "story": "Un gato negro sigue a Naio hasta un jardín donde conviven flores, insectos, hongos y aves. Allí, cada ser vivo cumple un papel.", "questions": [{"q": "¿Qué función cumplen muchas abejas al visitar flores?", "opts": ["Ayudan a transportar polen entre flores", "Transforman todas las flores en frutos instantáneamente", "Evitan que las plantas reciban luz"], "key": 0, "explanation": "La polinización facilita la reproducción de numerosas plantas."}, {"q": "En una cadena alimentaria, el pasto es consumido por un saltamontes y este por un ave. ¿Quién es el productor?", "opts": ["El ave", "El saltamontes", "El pasto"], "key": 2, "explanation": "Las plantas producen su alimento mediante la fotosíntesis."}, {"q": "¿Qué podría suceder si desaparecieran muchos insectos polinizadores?", "opts": ["Algunas plantas tendrían dificultades para reproducirse", "Todas las plantas dejarían de necesitar agua", "Los ecosistemas permanecerían idénticos"], "key": 0, "explanation": "La pérdida de polinizadores puede afectar la reproducción de plantas."}, {"q": "Un hongo crece sobre hojas caídas. ¿Qué papel puede cumplir en el ecosistema?", "opts": ["Descomponedor de materia orgánica", "Productor de luz solar", "Consumidor exclusivo de rocas"], "key": 0, "explanation": "Muchos hongos descomponen restos orgánicos y reciclan nutrientes."}, {"q": "¿Cuál acción protege mejor la biodiversidad del jardín?", "opts": ["Eliminar todas las especies distintas", "Evitar contaminar y conservar los hábitats", "Introducir basura para atraer animales"], "key": 1, "explanation": "Proteger hábitats y reducir la contaminación ayuda a conservar especies."}]}, {"emoji": "🌎", "title": "El último portal: guardianes de la Tierra", "story": "Para cerrar el portal, el equipo debe resolver desafíos sobre el planeta y tomar decisiones que cuiden los recursos naturales.", "questions": [{"q": "¿Qué produce principalmente la alternancia entre día y noche?", "opts": ["La rotación de la Tierra sobre su eje", "La traslación de la Luna alrededor del Sol", "Las fases de la Luna"], "key": 0, "explanation": "La rotación terrestre hace que distintas zonas reciban luz solar."}, {"q": "¿Cuál es una fuente de energía renovable?", "opts": ["La luz solar", "El petróleo", "El carbón mineral"], "key": 0, "explanation": "La energía solar se renueva de manera natural."}, {"q": "¿Qué ocurre durante la evaporación en el ciclo del agua?", "opts": ["El agua líquida pasa a estado gaseoso", "El vapor se convierte directamente en roca", "El agua desaparece del planeta"], "key": 0, "explanation": "La evaporación transforma agua líquida en vapor."}, {"q": "Si una comunidad encuentra residuos en un río, ¿qué decisión es más responsable?", "opts": ["Arrojar más residuos para que la corriente los lleve", "Organizar prevención y manejo adecuado de residuos", "Tapar el río para no verlo"], "key": 1, "explanation": "Prevenir la contaminación y manejar bien los residuos protege el agua."}, {"q": "Una noticia afirma que una planta crece mejor con música. ¿Qué sería necesario antes de aceptar la afirmación?", "opts": ["Realizar comparaciones controladas y observar evidencia", "Creerlo porque aparece en internet", "Preguntar solamente a una persona"], "key": 0, "explanation": "La evidencia y las pruebas controladas ayudan a evaluar afirmaciones."}]}];
const startedAt=new Date();let stage='welcome',chapter=0,qidx=0,answers={},reflection={emocion:'',dificultad:'',ayuda:'',estrategia:'',pregunta:'',final:''};const app=document.getElementById('app');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function setStage(s){stage=s;render();window.scrollTo(0,0)}
function saveField(k,v){reflection[k]=v}
function buttons(key,arr){return `<div class="options">${arr.map(v=>`<button type="button" class="${reflection[key]===v?'active':''}" data-field="${key}" data-value="${esc(v)}">${esc(v)}</button>`).join('')}</div>`}
function bindFields(){app.querySelectorAll('[data-field]').forEach(b=>b.onclick=()=>{saveField(b.dataset.field,b.dataset.value);render()});app.querySelectorAll('textarea[data-text]').forEach(t=>t.oninput=()=>saveField(t.dataset.text,t.value));}
function render(){let out='';
if(stage==='welcome'){out=`<div style="font-size:3.3rem">🔬🏐🐈‍⬛🌎</div><h1>La última misión de Shai</h1><h2 class="highlight">El laboratorio de los cuatro mundos</h2><p>¡Hola, Naio! Llegamos juntas a la última aventura. Ya recorriste historias, números y preguntas difíciles. Hoy no venimos a demostrar perfección: venimos a descubrir cuánto sabés y a disfrutar la ciencia.</p><p>Habrá <b>20 desafíos</b> en cuatro mundos. Podés hacer una pausa cuando lo necesités. No hay cronómetro ni nota en pantalla.</p><div class="nav"><button class="primary" id="go">¡Empezar nuestra última misión! ✨</button></div>`}
else if(stage==='feel'){out=`<div class="pill">🌸 Conversación con Shai</div><h1>Primero quiero escucharte</h1><p>¿Cómo fue el examen de Español? Podés responder con total sinceridad.</p><label>¿Cómo te sentiste?</label>${buttons('emocion',['Muy tranquila 😊','Contenta y segura 💜','Un poco nerviosa 🌸','Muy nerviosa 💭'])}<label>¿Cómo te parecieron las preguntas?</label>${buttons('dificultad',['Más fáciles de lo esperado','Una mezcla de fáciles y difíciles','Bastante difíciles'])}<label>¿Cuánto te ayudaron nuestras misiones?</label>${buttons('ayuda',['Mucho','Un poco','No estoy segura'])}<label>¿Qué estrategia usaste?</label>${buttons('estrategia',['Leí y revisé','Respondí muy rápido','Volví a leer algunas preguntas','Otra estrategia'])}<label>¿Hay algo que querás preguntarme antes de Ciencias?</label><textarea data-text="pregunta" placeholder="Podés escribir lo que quieras...">${esc(reflection.pregunta)}</textarea><div class="nav"><button id="back">Volver</button><button class="primary" id="next">Ir al repaso →</button></div>`}
else if(stage==='guide'){out=`<div class="pill">🧠 Repaso tranquilo</div><h1>Tu brújula científica</h1><p>Antes de empezar, recordemos algunas ideas que te pueden ayudar mañana:</p><p>🌱 <b>Seres vivos:</b> las plantas producen su alimento, los animales obtienen energía de los alimentos y los descomponedores reciclan materia.</p><p>💓 <b>Cuerpo humano:</b> respirar, alimentarse, circular la sangre y descansar son procesos que se relacionan.</p><p>💧 <b>Materia y energía:</b> el agua puede cambiar de estado; la energía puede transferirse o transformarse.</p><p>🌎 <b>Tierra y ambiente:</b> la rotación explica el día y la noche; nuestras decisiones pueden proteger los ecosistemas.</p><div class="story"><b>La regla de oro:</b> leé qué pregunta el problema, observá las pistas y elegí la explicación que mejor se apoya en la ciencia. Si dudás, podés regresar.</div><div class="nav"><button id="back">Volver</button><button class="primary" id="next">Entrar al primer mundo →</button></div>`}
else if(stage==='quiz'){const c=DATA[chapter],x=c.questions[qidx],id=chapter+'-'+qidx,total=DATA.reduce((a,z)=>a+z.questions.length,0),position=DATA.slice(0,chapter).reduce((a,z)=>a+z.questions.length,0)+qidx+1;out=`<div class="pill">${c.emoji} Mundo ${chapter+1} de ${DATA.length} · Pregunta ${position} de ${total}</div><div class="progress"><div style="width:${Math.round((position-1)/total*100)}%"></div></div><h1>${esc(c.title)}</h1><div class="story">${esc(c.story)}</div><h2>${esc(x.q)}</h2><div class="choices">${x.opts.map((o,i)=>`<button type="button" class="choice ${answers[id]===i?'selected':''}" data-choice="${i}" aria-pressed="${answers[id]===i}">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}</div><p class="muted">Elegí la respuesta que te parezca mejor. Podés cambiarla antes de avanzar.</p><div class="nav"><button id="back">← Anterior</button><button class="primary" id="next" ${answers[id]===undefined?'disabled':''}>${position===total?'Terminar desafíos ✨':'Siguiente →'}</button></div>`}
else if(stage==='end'){out=`<div style="font-size:3.2rem">🎓💜🐈‍⬛</div><h1>¡Lo lograste, Naio!</h1><p>Terminaste los cuatro mundos. No importa cuántas preguntas te hicieron dudar: lo importante es que te animaste a pensar, observar y seguir aprendiendo.</p><p>Esta fue nuestra última misión antes de terminar las pruebas. Quiero que recordés que <b>una calificación no puede medir todo tu esfuerzo, tu imaginación, tu valentía ni tu capacidad de aprender.</b></p><label>¿Cómo te sentís al terminar este camino de misiones?</label>${buttons('final',['Orgullosa de mí 💜','Más tranquila 🌸','Cansada, pero feliz 🐈‍⬛','Todavía un poquito nerviosa 💭'])}<p>Podés guardar tu aventura para compartirla en casa. El archivo contiene tus respuestas y reflexiones, pero <b>no mostrará una nota aquí</b>.</p><div class="nav"><button id="back">Revisar última pregunta</button><button class="primary" id="download">Guardar mi aventura ⬇️</button></div>`}
app.innerHTML=out;bindFields();let b=app.querySelector('#back'),n=app.querySelector('#next'),go=app.querySelector('#go');if(go)go.onclick=()=>setStage('feel');if(b)b.onclick=()=>{if(stage==='feel')setStage('welcome');else if(stage==='guide')setStage('feel');else if(stage==='end'){chapter=DATA.length-1;qidx=DATA[chapter].questions.length-1;setStage('quiz')}else if(stage==='quiz'){if(qidx>0)qidx--;else if(chapter>0){chapter--;qidx=DATA[chapter].questions.length-1}else return setStage('guide');render();window.scrollTo(0,0)}};if(n)n.onclick=()=>{if(stage==='feel')return setStage('guide');if(stage==='guide')return setStage('quiz');if(stage==='quiz'){if(qidx+1<DATA[chapter].questions.length)qidx++;else if(chapter+1<DATA.length){chapter++;qidx=0}else return setStage('end');render();window.scrollTo(0,0)}};app.querySelectorAll('[data-choice]').forEach(el=>el.onclick=()=>{answers[chapter+'-'+qidx]=Number(el.dataset.choice);render()});let dl=app.querySelector('#download');if(dl)dl.onclick=download;
}
function download(){let details=[],themes={};DATA.forEach((c,ci)=>{let good=0;c.questions.forEach((q,qi)=>{let index=answers[ci+'-'+qi],ok=index===q.key;if(ok)good++;details.push({numero:details.length+1,mundo:c.title,pregunta:q.q,respuesta:index===undefined?null:q.opts[index],clave:q.opts[q.key],acierto:ok,explicacion:q.explanation})});themes[c.title]={correctas:good,total:c.questions.length}});let result={mision:'La ultima mision de Shai - Ciencias',fecha:new Date().toLocaleString('es-CR'),duracion_min:Math.max(1,Math.round((Date.now()-startedAt.getTime())/60000)),tipo:'repaso_guiado_y_practica_sin_nota',reflexion_espanol:reflection,temas:themes,detalle:details};let blob=new Blob([JSON.stringify(result,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='resultado_mision_final_ciencias.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
render();</script></body></html>
